services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
    network_mode: host

    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
